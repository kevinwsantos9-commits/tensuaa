name: Build Sistema Tensura

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar mod
        run: ./gradlew build --no-daemon

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Tensura-Absorcao
          path: build/libs/*.jar
